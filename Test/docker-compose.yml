# docker-compose.yml
services:
  flask-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: flask-app
    ports:
      - "5000:5000"

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask-app
  ngrok:
    image: ngrok/ngrok:latest
    container_name: ngrok
    restart: unless-stopped
    command: http nginx:80 --domain=chief-woodcock-friendly.ngrok-free.app
    environment:
      - NGROK_AUTHTOKEN=30V6Pbu6J7Op4wnLmbHWsap7tQ2_3yHNWG5uZPY1o9jCt6gmc